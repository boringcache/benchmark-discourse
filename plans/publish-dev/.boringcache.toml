workspace = "boringcache/benchmark-discourse"

[adapters.docker]
tag = "discourse-image-factory"
no-platform = true
no-git = true
fail-on-cache-error = true
metadata-hints = ["benchmark=discourse", "upstream-job=base", "upstream-step=publish-dev"]
command = [
  "docker",
  "buildx",
  "bake",
  "dev",
  "--set=*.tags=ghcr.io/boringcache/discourse-benchmark-dev",
  "--set=*.output=type=registry,push-by-digest=true",
  "--allow=fs.read=../templates",
  "--metadata-file=/tmp/dev.json",
]
