workspace = "boringcache/benchmark-discourse"

[adapters.docker]
tag = "discourse-image-factory-fresh-arm64"
no-platform = true
no-git = true
fail-on-cache-error = true
metadata-hints = ["benchmark=discourse", "upstream-job=base", "lane=fresh", "arch=arm64"]
command = [
  "docker", "buildx", "bake",
  "base-runtime-deps",
  "base-slim",
  "base-web-only",
  "base-release",
  "test-release-arm64",
  "--set=base-runtime-deps-*.no-cache=true",
  "--load",
]

[adapters.ccache]
tag = "discourse-ccache-fresh-arm64"
no-platform = true
no-git = true
fail-on-cache-error = true
metadata-hints = ["benchmark=discourse", "upstream-job=base", "lane=fresh", "arch=arm64", "tool=ccache"]
