workspace = "discourse/benchmark-discourse"

[adapters.docker]
tag = "discourse-image-factory-fresh-amd64"
no-platform = true
no-git = true
fail-on-cache-error = true
metadata-hints = ["benchmark=discourse", "upstream-job=base", "lane=fresh", "arch=amd64"]
command = [
  "docker", "buildx", "bake",
  "base-runtime-deps", "base-slim-main", "base-slim-stable",
  "base-web-only-main", "base-web-only-stable",
  "base-release-main", "base-release-stable", "test-release",
]

[adapters.ccache]
tag = "discourse-ccache-fresh-amd64"
no-platform = true
no-git = true
fail-on-cache-error = true
metadata-hints = ["benchmark=discourse", "upstream-job=base", "lane=fresh", "arch=amd64", "tool=ccache"]
