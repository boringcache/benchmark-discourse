workspace = "boringcache/benchmark-discourse"

[adapters.docker]
tag = "discourse-image-factory"
no-platform = true
no-git = true
fail-on-cache-error = true
metadata-hints = ["benchmark=discourse", "upstream-job=base", "upstream-step=test-release-amd64"]
command = [
  "docker",
  "buildx",
  "bake",
  "test-release-amd64",
  "--load",
]
