workspace = "boringcache/benchmark-discourse"

[adapters.docker]
tag = "discourse-image-factory"
no-platform = true
no-git = true
fail-on-cache-error = true
metadata-hints = ["benchmark=discourse", "upstream-job=base", "upstream-step=publish-test"]
command = [
  "docker",
  "buildx",
  "bake",
  "test",
  "--set=*.tags=ghcr.io/boringcache/discourse-benchmark-test",
  "--set=*.output=type=registry,push-by-digest=true",
  "--metadata-file=/tmp/test.json",
]
