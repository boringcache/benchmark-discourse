workspace = "boringcache/benchmark-discourse"

[adapters.docker]
tag = "discourse-image-factory"
no-platform = true
no-git = true
fail-on-cache-error = true
metadata-hints = ["benchmark=discourse", "upstream-job=base", "upstream-step=base-web-only"]
command = [
  "docker",
  "buildx",
  "bake",
  "base-web-only",
  "--load",
]
