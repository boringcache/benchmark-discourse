workspace = "boringcache/benchmark-discourse"

[adapters.docker]
tag = "discourse-image-factory"
no-platform = true
no-git = true
fail-on-cache-error = true
metadata-hints = ["benchmark=discourse", "upstream-job=base", "upstream-step=publish-base"]
command = [
  "docker",
  "buildx",
  "bake",
  "--file",
  "../../docker-upstream/image/docker-bake.hcl",
  "base",
  "--set=*.tags=ghcr.io/boringcache/discourse-benchmark-base",
  "--set=*.output=type=registry,push-by-digest=true",
  "--metadata-file=/tmp/base.json",
]
