name: "Discourse Image Factory Benchmark"
run-name: ${{ format('Benchmark {0} | {1}', inputs.cli_version != '' && 'Canary' || 'Rolling', github.event_name == 'push' && 'Upstream update' || format('Manual dispatch ({0})', github.ref_name)) }}
on:
  workflow_dispatch:
    inputs:
      buildkit_image: {description: "Optional managed BoringCache BuildKit image.", required: false, type: string, default: ""}
      cli_version: {description: "Optional exact BoringCache CLI release tag.", required: false, type: string, default: ""}
      benchmark_id_suffix: {description: "Optional suffix for isolated comparison runs.", required: false, type: string, default: ""}
      runner_label: {description: "Optional runner label for a manual main-branch experiment.", required: false, type: string, default: ""}
  push:
    branches: [main]
    paths: [".gitmodules", "docker-upstream"]
concurrency: {group: "${{ github.workflow }}-${{ github.ref_name }}", cancel-in-progress: false}
permissions: {contents: read, actions: write, packages: write}
env:
  BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
  BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}
  BORINGCACHE_NO_GIT: "true"
jobs:
  commit:
    name: ${{ matrix.provider }} Discourse ${{ matrix.case.name }} commit
    if: inputs.runner_label == '' || github.ref_name == 'main'
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main' && inputs.runner_label || 'ubuntu-latest' }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        strategy: [actions-cache, boringcache]
        include:
          - {strategy: actions-cache, provider: GitHub Actions}
          - {strategy: boringcache, provider: BoringCache}
        case:
          - {name: base deps, benchmark_id: discourse-base-deps, dockerfile: docker-upstream/image/base/Dockerfile, context: docker-upstream/image/base, image: discourse-base-deps-benchmark, target: discourse-build-base, build_args: ""}
          - {name: base web, benchmark_id: discourse-base-web-only, dockerfile: docker-upstream/image/base/Dockerfile, context: docker-upstream/image/base, image: discourse-base-web-only-benchmark, target: discourse-web-only, build_args: DISCOURSE_BRANCH=main}
          - {name: base release, benchmark_id: discourse-base-release, dockerfile: docker-upstream/image/base/Dockerfile, context: docker-upstream/image/base, image: discourse-base-release-benchmark, target: discourse-release, build_args: DISCOURSE_BRANCH=main}
          - {name: test release, benchmark_id: discourse-test-release, dockerfile: docker-upstream/image/discourse_test/Dockerfile, context: docker-upstream/image/discourse_test, image: discourse-test-release-benchmark, target: release, build_args: "from_tag=discourse/base:release"}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/discourse-docker-benchmark
        with: {strategy: "${{ matrix.strategy }}", cache_lane: rolling, phase: publish, benchmark_id: "${{ format('{0}{1}', matrix.case.benchmark_id, inputs.benchmark_id_suffix) }}", dockerfile: "${{ matrix.case.dockerfile }}", context: "${{ matrix.case.context }}", image: "${{ matrix.case.image }}", target: "${{ matrix.case.target }}", build_args: "${{ matrix.case.build_args }}", cli_version: "${{ inputs.cli_version }}", buildkit_image: "${{ inputs.buildkit_image }}", push_image: "true"}
  report:
    name: Discourse image factory rolling report
    needs: commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Download the benchmark phase evidence
        uses: actions/download-artifact@v6
        with:
          pattern: phase-*
          path: phase-evidence
      - name: Publish the Discourse image factory benchmark report
        run: |
          python3 ./scripts/benchmark-report.py summarize \
            --title "Discourse image factory rolling benchmark" \
            --input-dir phase-evidence \
            --output-dir benchmark-results
      - name: Retain the discourse-base-deps BoringCache rolling result
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-discourse-base-deps${{ inputs.benchmark_id_suffix }}-boringcache-rolling
          path: benchmark-results/discourse-base-deps${{ inputs.benchmark_id_suffix }}-boringcache-rolling.json
          if-no-files-found: error
      - name: Retain the discourse-base-deps GitHub Actions rolling result
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-discourse-base-deps${{ inputs.benchmark_id_suffix }}-actions-cache-rolling
          path: benchmark-results/discourse-base-deps${{ inputs.benchmark_id_suffix }}-actions-cache-rolling.json
          if-no-files-found: error
      - name: Retain the discourse-base-web-only BoringCache rolling result
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-discourse-base-web-only${{ inputs.benchmark_id_suffix }}-boringcache-rolling
          path: benchmark-results/discourse-base-web-only${{ inputs.benchmark_id_suffix }}-boringcache-rolling.json
          if-no-files-found: error
      - name: Retain the discourse-base-web-only GitHub Actions rolling result
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-discourse-base-web-only${{ inputs.benchmark_id_suffix }}-actions-cache-rolling
          path: benchmark-results/discourse-base-web-only${{ inputs.benchmark_id_suffix }}-actions-cache-rolling.json
          if-no-files-found: error
      - name: Retain the discourse-base-release BoringCache rolling result
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-discourse-base-release${{ inputs.benchmark_id_suffix }}-boringcache-rolling
          path: benchmark-results/discourse-base-release${{ inputs.benchmark_id_suffix }}-boringcache-rolling.json
          if-no-files-found: error
      - name: Retain the discourse-base-release GitHub Actions rolling result
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-discourse-base-release${{ inputs.benchmark_id_suffix }}-actions-cache-rolling
          path: benchmark-results/discourse-base-release${{ inputs.benchmark_id_suffix }}-actions-cache-rolling.json
          if-no-files-found: error
      - name: Retain the discourse-test-release BoringCache rolling result
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-discourse-test-release${{ inputs.benchmark_id_suffix }}-boringcache-rolling
          path: benchmark-results/discourse-test-release${{ inputs.benchmark_id_suffix }}-boringcache-rolling.json
          if-no-files-found: error
      - name: Retain the discourse-test-release GitHub Actions rolling result
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-discourse-test-release${{ inputs.benchmark_id_suffix }}-actions-cache-rolling
          path: benchmark-results/discourse-test-release${{ inputs.benchmark_id_suffix }}-actions-cache-rolling.json
          if-no-files-found: error
