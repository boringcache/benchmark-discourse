name: "Discourse Image Factory Benchmark"
run-name: >-
  ${{ format('Benchmark Rolling | {0}', github.event_name == 'push' && 'Upstream update' || github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || format('Manual dispatch ({0})', github.ref_name)) }}

on:
  workflow_dispatch:
    inputs:
      buildkit_image:
        description: "Optional managed BoringCache BuildKit image."
        required: false
        type: string
        default: ""
      cli_version:
        description: "Optional exact BoringCache CLI release tag."
        required: false
        type: string
        default: ""
      benchmark_id_suffix:
        description: "Optional suffix for isolated comparison runs."
        required: false
        type: string
        default: ""
  push:
    branches:
      - main
    paths:
      - ".gitmodules"
      - "docker-upstream"
  pull_request:
    paths:
      - ".boringcache.toml"
      - ".gitmodules"
      - ".github/workflows/discourse-image-factory-benchmark.yml"
      - ".github/workflows/reusable-discourse-docker-benchmark.yml"
      - "README.md"
      - "benchmark/**"
      - "scripts/**"
      - "docker-upstream"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  packages: read

jobs:
  benchmark:
    name: ${{ matrix.strategy == 'boringcache' && 'BC' || 'GHA' }} / ${{ matrix.case.name }}
    strategy:
      fail-fast: false
      matrix:
        strategy:
          - actions-cache
          - boringcache
        case:
          - name: base deps
            benchmark_id: discourse-base-deps
            dockerfile: docker-upstream/image/base/Dockerfile
            context: docker-upstream/image/base
            image: discourse-base-deps-benchmark
            target: discourse-build-base
            build_args: ""
          - name: base web
            benchmark_id: discourse-base-web-only
            dockerfile: docker-upstream/image/base/Dockerfile
            context: docker-upstream/image/base
            image: discourse-base-web-only-benchmark
            target: discourse-web-only
            build_args: DISCOURSE_BRANCH=main
          - name: base release
            benchmark_id: discourse-base-release
            dockerfile: docker-upstream/image/base/Dockerfile
            context: docker-upstream/image/base
            image: discourse-base-release-benchmark
            target: discourse-release
            build_args: DISCOURSE_BRANCH=main
          - name: test release
            benchmark_id: discourse-test-release
            dockerfile: docker-upstream/image/discourse_test/Dockerfile
            context: docker-upstream/image/discourse_test
            image: discourse-test-release-benchmark
            target: release
            build_args: from_tag=discourse/base:release
    uses: ./.github/workflows/reusable-discourse-docker-benchmark.yml
    with:
      strategy: ${{ matrix.strategy }}
      cache_lane: ${{ github.event_name == 'pull_request' && 'fresh' || 'rolling' }}
      benchmark_id: ${{ format('{0}{1}', matrix.case.benchmark_id, inputs.benchmark_id_suffix) }}
      dockerfile: ${{ matrix.case.dockerfile }}
      context: ${{ matrix.case.context }}
      image: ${{ matrix.case.image }}
      target: ${{ matrix.case.target }}
      build_args: ${{ matrix.case.build_args }}
      cli_version: ${{ inputs.cli_version }}
      buildkit_image: ${{ inputs.buildkit_image }}
    secrets: inherit
