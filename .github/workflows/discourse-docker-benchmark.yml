name: "Discourse Docker Benchmark"
run-name: ${{ format('Benchmark {0} | {1}', inputs.cli_version != '' && 'Canary' || 'Rolling', github.event_name == 'push' && 'Upstream update' || format('Manual dispatch ({0})', github.ref_name)) }}
on:
  workflow_dispatch:
    inputs:
      buildkit_image: {description: "Optional managed BoringCache BuildKit image.", required: false, type: string, default: ""}
      cli_version: {description: "Optional exact BoringCache CLI release tag.", required: false, type: string, default: ""}
      benchmark_id_suffix: {description: "Optional suffix for isolated comparison runs.", required: false, type: string, default: ""}
      runner_label: {description: "Optional runner label for a manual main-branch experiment.", required: false, type: string, default: ""}
  push:
    branches: [main]
    paths: [".gitmodules", "upstream", "docker-upstream"]
concurrency: {group: "${{ github.workflow }}-${{ github.ref_name }}", cancel-in-progress: false}
permissions: {contents: read, actions: write, packages: write}
env:
  BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
  BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}
  BORINGCACHE_NO_GIT: "true"
jobs:
  commit:
    name: ${{ matrix.provider }} Discourse dev commit
    if: inputs.runner_label == '' || github.ref_name == 'main'
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main' && inputs.runner_label || 'ubuntu-latest' }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - {provider: GitHub Actions, strategy: actions-cache}
          - {provider: BoringCache, strategy: boringcache}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/discourse-docker-benchmark
        with:
          strategy: ${{ matrix.strategy }}
          cache_lane: rolling
          phase: publish
          benchmark_id: ${{ format('discourse-docker{0}', inputs.benchmark_id_suffix) }}
          push_image: "true"
          dockerfile: benchmark/discourse-dev.Dockerfile
          context: .
          image: discourse-benchmark
          cli_version: ${{ inputs.cli_version }}
          buildkit_image: ${{ inputs.buildkit_image }}
  report:
    name: Discourse Docker rolling report
    needs: commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Download the benchmark phase evidence
        uses: actions/download-artifact@v6
        with:
          pattern: phase-*
          path: phase-evidence
      - name: Publish the Discourse Docker benchmark report
        run: |
          python3 ./scripts/benchmark-report.py summarize \
            --title "Discourse Docker rolling benchmark" \
            --input-dir phase-evidence \
            --output-dir benchmark-results
      - name: Retain the discourse BoringCache rolling result
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-discourse-boringcache-rolling
          path: benchmark-results/discourse-boringcache-rolling.json
          if-no-files-found: error
      - name: Retain the discourse GitHub Actions rolling result
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-discourse-actions-cache-rolling
          path: benchmark-results/discourse-actions-cache-rolling.json
          if-no-files-found: error
