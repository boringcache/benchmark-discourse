name: "Reusable Discourse Docker Benchmark"

on:
  workflow_call:
    inputs:
      strategy:
        required: true
        type: string
      cache_lane:
        required: true
        type: string
      benchmark_id:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      context:
        required: true
        type: string
      image:
        required: true
        type: string
      target:
        required: false
        type: string
        default: ""
      build_args:
        required: false
        type: string
        default: ""
      cli_version:
        required: false
        type: string
        default: ""
      buildkit_image:
        required: false
        type: string
        default: ""

env:
  BENCHMARK_ID: ${{ inputs.benchmark_id }}
  CACHE_LANE: ${{ inputs.cache_lane }}
  DOCKERFILE: ${{ inputs.dockerfile }}
  DOCKER_CONTEXT: ${{ inputs.context }}
  IMAGE: ${{ inputs.image }}
  TARGET: ${{ inputs.target }}
  BUILD_ARGS: ${{ inputs.build_args }}

jobs:
  publish:
    name: ${{ inputs.cache_lane == 'rolling' && 'Commit' || 'Cold' }}
    runs-on: ubuntu-latest-8-cores
    timeout-minutes: 180
    outputs:
      cache_scope: ${{ steps.scope.outputs.cache_scope }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false
      - name: Checkout pinned Discourse sources
        run: |
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --depth 1 --recommend-shallow --jobs 4 upstream docker-upstream
      - name: Prepare clean Discourse sources
        run: ./scripts/prepare-source.sh base
      - name: Select the cache cohort
        id: scope
        run: |
          set -euo pipefail
          ref_slug="$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._-' '-')"
          ref_slug="${ref_slug#-}"
          ref_slug="${ref_slug%-}"
          ref_slug="${ref_slug:-main}"
          if [[ "$CACHE_LANE" == "rolling" ]]; then
            cache_scope="${BENCHMARK_ID}-rolling-${ref_slug}"
          else
            cache_scope="${BENCHMARK_ID}-run-r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
          fi
          ./scripts/scope-boringcache-run.sh "$cache_scope"
          echo "cache_scope=${cache_scope}" >> "$GITHUB_OUTPUT"
      - name: Set up Buildx for the GitHub Actions comparison
        if: inputs.strategy == 'actions-cache'
        uses: docker/setup-buildx-action@v4
      - name: Build with the GitHub Actions cache
        if: inputs.strategy == 'actions-cache'
        env:
          CACHE_SCOPE: ${{ steps.scope.outputs.cache_scope }}
        run: |
          set -euo pipefail
          target_args=()
          [[ -z "$TARGET" ]] || target_args+=(--target "$TARGET")
          build_args=()
          while IFS= read -r value; do
            [[ -z "$value" ]] || build_args+=(--build-arg "$value")
          done <<< "$BUILD_ARGS"
          docker buildx build \
            --file "$DOCKERFILE" \
            --tag "${IMAGE}:latest" \
            --cache-from "type=gha,scope=${CACHE_SCOPE}" \
            --cache-to "type=gha,scope=${CACHE_SCOPE},mode=max" \
            --load \
            "${target_args[@]}" \
            "${build_args[@]}" \
            "$DOCKER_CONTEXT"
      - name: Build with BoringCache
        if: inputs.strategy == 'boringcache'
        uses: boringcache/one@09e053620cda4d3472f26a3ddd181144a108e2c2 # v1.16.8
        with:
          cli-version: ${{ inputs.cli_version }}
          setup: none
          mode: docker
          trust-policy: publish
          context: ${{ inputs.context }}
          dockerfile: ${{ inputs.dockerfile }}
          image: ${{ inputs.image }}
          tags: latest
          target: ${{ inputs.target }}
          build-args: ${{ inputs.build_args }}
          load: true
          fail-on-cache-error: true
          metadata-hints: benchmark=${{ inputs.benchmark_id }},phase=${{ inputs.cache_lane == 'rolling' && 'rolling' || 'fresh-cold' }}
          managed-buildkit-image: ${{ inputs.buildkit_image }}
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}
          BORINGCACHE_NO_GIT: "true"
      - name: Verify the Discourse image
        run: docker image inspect "${IMAGE}:latest" >/dev/null

  restore:
    name: Warm
    needs: publish
    if: inputs.cache_lane == 'fresh'
    runs-on: ubuntu-latest-8-cores
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false
      - name: Checkout pinned Discourse sources
        run: |
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --depth 1 --recommend-shallow --jobs 4 upstream docker-upstream
      - name: Prepare clean Discourse sources
        run: ./scripts/prepare-source.sh warm1
      - name: Select the published cache cohort
        run: ./scripts/scope-boringcache-run.sh "${{ needs.publish.outputs.cache_scope }}"
      - name: Set up Buildx for the GitHub Actions comparison
        if: inputs.strategy == 'actions-cache'
        uses: docker/setup-buildx-action@v4
      - name: Build with the exact GitHub Actions cache
        if: inputs.strategy == 'actions-cache'
        env:
          CACHE_SCOPE: ${{ needs.publish.outputs.cache_scope }}
        run: |
          set -euo pipefail
          target_args=()
          [[ -z "$TARGET" ]] || target_args+=(--target "$TARGET")
          build_args=()
          while IFS= read -r value; do
            [[ -z "$value" ]] || build_args+=(--build-arg "$value")
          done <<< "$BUILD_ARGS"
          docker buildx build \
            --file "$DOCKERFILE" \
            --tag "${IMAGE}:latest" \
            --cache-from "type=gha,scope=${CACHE_SCOPE}" \
            --cache-to "type=gha,scope=${CACHE_SCOPE},mode=max" \
            --load \
            "${target_args[@]}" \
            "${build_args[@]}" \
            "$DOCKER_CONTEXT"
      - name: Restore the exact BoringCache Docker cache
        if: inputs.strategy == 'boringcache'
        uses: boringcache/one@09e053620cda4d3472f26a3ddd181144a108e2c2 # v1.16.8
        with:
          cli-version: ${{ inputs.cli_version }}
          setup: none
          mode: docker
          trust-policy: restore
          context: ${{ inputs.context }}
          dockerfile: ${{ inputs.dockerfile }}
          image: ${{ inputs.image }}
          tags: latest
          target: ${{ inputs.target }}
          build-args: ${{ inputs.build_args }}
          load: true
          fail-on-cache-miss: true
          fail-on-cache-error: true
          metadata-hints: benchmark=${{ inputs.benchmark_id }},phase=fresh-warm
          managed-buildkit-image: ${{ inputs.buildkit_image }}
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_NO_GIT: "true"
      - name: Verify the restored Discourse image
        run: docker image inspect "${IMAGE}:latest" >/dev/null
