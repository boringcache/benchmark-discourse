name: "Discourse Docker Fresh"
run-name: >-
  ${{ format('Benchmark {0} | {1}', github.event_name == 'pull_request' && 'Validation' || inputs.cli_version != '' && 'Canary' || 'Fresh', github.event_name == 'schedule' && 'Weekly' || github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || format('Manual dispatch ({0})', github.ref_name)) }}
on:
  workflow_dispatch:
    inputs:
      buildkit_image: {description: "Optional managed BoringCache BuildKit image.", required: false, type: string, default: ""}
      cli_version: {description: "Optional exact BoringCache CLI release tag.", required: false, type: string, default: ""}
      benchmark_id_suffix: {description: "Optional suffix for isolated comparison runs.", required: false, type: string, default: ""}
      runner_label: {description: "Optional runner label for a manual main-branch experiment.", required: false, type: string, default: ""}
  schedule: [{cron: "17 3 * * 0"}]
  pull_request:
    paths: [".boringcache.toml", ".gitmodules", ".github/actions/discourse-docker-benchmark/**", ".github/workflows/discourse-docker-benchmark.yml", ".github/workflows/discourse-fresh-benchmark.yml", "benchmark/**", "scripts/**", "upstream", "docker-upstream"]
concurrency: {group: "${{ github.workflow }}-${{ github.ref_name }}", cancel-in-progress: false}
permissions: {contents: read, actions: write, packages: read}
env:
  BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
  BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}
  BORINGCACHE_NO_GIT: "true"
jobs:
  cold:
    name: ${{ matrix.provider }} Discourse dev cold
    if: inputs.runner_label == '' || github.ref_name == 'main'
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main' && inputs.runner_label || 'ubuntu-latest' }}
    timeout-minutes: 180
    strategy: &provider_matrix
      fail-fast: false
      matrix:
        include:
          - {provider: GitHub Actions, strategy: actions-cache}
          - {provider: BoringCache, strategy: boringcache}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/discourse-docker-benchmark
        with: {strategy: "${{ matrix.strategy }}", cache_lane: fresh, phase: publish, benchmark_id: "${{ format('discourse-docker{0}', inputs.benchmark_id_suffix) }}", dockerfile: benchmark/discourse-dev.Dockerfile, context: ., image: discourse-benchmark, cli_version: "${{ inputs.cli_version }}", buildkit_image: "${{ inputs.buildkit_image }}"}
  warm:
    name: ${{ matrix.provider }} Discourse dev warm
    needs: cold
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main' && inputs.runner_label || 'ubuntu-latest' }}
    timeout-minutes: 180
    strategy: *provider_matrix
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/discourse-docker-benchmark
        with: {strategy: "${{ matrix.strategy }}", cache_lane: fresh, phase: warm, benchmark_id: "${{ format('discourse-docker{0}', inputs.benchmark_id_suffix) }}", dockerfile: benchmark/discourse-dev.Dockerfile, context: ., image: discourse-benchmark, cli_version: "${{ inputs.cli_version }}", buildkit_image: "${{ inputs.buildkit_image }}"}
  report:
    name: Discourse Docker fresh report
    needs: warm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Download the benchmark phase evidence
        uses: actions/download-artifact@v6
        with:
          pattern: phase-*
          path: phase-evidence
      - name: Publish the Discourse Docker benchmark report
        run: |
          python3 ./scripts/benchmark-report.py summarize \
            --title "Discourse Docker fresh benchmark" \
            --input-dir phase-evidence \
            --output-dir benchmark-results
      - name: Retain the discourse BoringCache fresh result
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-discourse-boringcache-fresh
          path: benchmark-results/discourse-boringcache-fresh.json
          if-no-files-found: error
      - name: Retain the discourse GitHub Actions fresh result
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-discourse-actions-cache-fresh
          path: benchmark-results/discourse-actions-cache-fresh.json
          if-no-files-found: error
