name: "Discourse upstream image factory"
run-name: ${{ format('Discourse image factory | {0}', github.event_name == 'push' && 'Upstream update' || format('Manual dispatch ({0})', github.ref_name)) }}

on:
  workflow_dispatch:
    inputs:
      cli_version: {description: "Optional exact BoringCache CLI release or prerelease tag.", required: false, type: string, default: ""}
      buildkit_image: {description: "Optional managed BuildKit image canary.", required: false, type: string, default: ""}
      benchmark_id_suffix: {description: "Optional suffix for an isolated comparison.", required: false, type: string, default: ""}
      bundler_cache_experiment: {description: "Run the isolated Bundler mount-cache lane on amd64.", required: false, type: boolean, default: false}
      ccache_experiment: {description: "Run the isolated Docker ccache tool-cache lane on amd64.", required: false, type: boolean, default: false}
      discourse_ref: {description: "Optional full Discourse commit SHA for a historical run.", required: false, type: string, default: ""}
      docker_ref: {description: "Optional full discourse_docker commit SHA at or after the Mozilla-key fix.", required: false, type: string, default: ""}
  push:
    branches: [main]
    paths: [".boringcache.toml", ".gitmodules", "plans/**", "scripts/**", ".github/actions/discourse-image-factory/**", "upstream", "docker-upstream"]

concurrency: {group: "${{ github.workflow }}-${{ github.ref_name }}", cancel-in-progress: false}
permissions: {contents: read, actions: write, packages: read}

env:
  BUILDKIT_PROGRESS: plain
  BASE_IMAGE: ghcr.io/boringcache/discourse-benchmark-base
  TEST_IMAGE: ghcr.io/boringcache/discourse-benchmark-test
  BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
  BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}

jobs:
  commit:
    name: ${{ matrix.provider }} ${{ matrix.arch }} commit
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.bundler_cache_experiment && !inputs.ccache_experiment) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      ARCH: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {provider: GitHub Actions, strategy: actions-cache, arch: amd64, runner: ubuntu-24.04}
          - {provider: BoringCache, strategy: boringcache, arch: amd64, runner: ubuntu-24.04}
          - {provider: GitHub Actions, strategy: actions-cache, arch: arm64, runner: ubuntu-24.04-arm}
          - {provider: BoringCache, strategy: boringcache, arch: arm64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/discourse-image-factory
        with:
          strategy: ${{ matrix.strategy }}
          cache_lane: rolling
          phase: publish
          arch: ${{ matrix.arch }}
          benchmark_id: ${{ format('discourse-image-factory{0}', inputs.benchmark_id_suffix) }}
          discourse_ref: ${{ inputs.discourse_ref }}
          docker_ref: ${{ inputs.docker_ref }}
          cli_version: ${{ inputs.cli_version }}
          buildkit_image: ${{ inputs.buildkit_image }}

  bundler:
    name: ${{ matrix.provider }} amd64 commit
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.bundler_cache_experiment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - {provider: GitHub Actions control, strategy: actions-cache, report_strategy: actions-cache, cache_profile: ""}
          - {provider: BoringCache control, strategy: boringcache, report_strategy: boringcache, cache_profile: ""}
          - {provider: BoringCache + Bundler mount, strategy: boringcache, report_strategy: boringcache-bundler, cache_profile: bundler}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/discourse-image-factory
        with:
          strategy: ${{ matrix.strategy }}
          report_strategy: ${{ matrix.report_strategy }}
          cache_profile: ${{ matrix.cache_profile }}
          cache_lane: rolling
          phase: publish
          arch: amd64
          benchmark_id: ${{ format('discourse-bundler-cache{0}', inputs.benchmark_id_suffix) }}
          discourse_ref: ${{ inputs.discourse_ref }}
          docker_ref: ${{ inputs.docker_ref }}
          cli_version: ${{ inputs.cli_version }}
          buildkit_image: ${{ inputs.buildkit_image }}

  ccache:
    name: ${{ matrix.provider }} amd64 commit
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.ccache_experiment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - {provider: GitHub Actions control, strategy: actions-cache, report_strategy: actions-cache, cache_profile: ""}
          - {provider: BoringCache control, strategy: boringcache, report_strategy: boringcache, cache_profile: ""}
          - {provider: BoringCache + ccache, strategy: boringcache, report_strategy: boringcache-ccache, cache_profile: ccache}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/discourse-image-factory
        with:
          strategy: ${{ matrix.strategy }}
          report_strategy: ${{ matrix.report_strategy }}
          cache_profile: ${{ matrix.cache_profile }}
          cache_lane: rolling
          phase: publish
          arch: amd64
          benchmark_id: ${{ format('discourse-ccache{0}', inputs.benchmark_id_suffix) }}
          discourse_ref: ${{ inputs.discourse_ref }}
          docker_ref: ${{ inputs.docker_ref }}
          cli_version: ${{ inputs.cli_version }}
          buildkit_image: ${{ inputs.buildkit_image }}

  report:
    name: Discourse image-factory rolling report
    needs: commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with: {pattern: "phase-discourse-image-factory${{ inputs.benchmark_id_suffix }}-*", path: phase-evidence}
      - run: python3 ./scripts/benchmark-report.py summarize --title "Discourse upstream image-factory rolling benchmark" --input-dir phase-evidence --output-dir benchmark-results
      - name: Retain the BoringCache amd64 rolling result
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-discourse-image-factory${{ inputs.benchmark_id_suffix }}-boringcache-amd64-rolling
          path: benchmark-results/discourse-image-factory${{ inputs.benchmark_id_suffix }}-boringcache-amd64-rolling.json
          if-no-files-found: error
      - name: Retain the GitHub Actions amd64 rolling result
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-discourse-image-factory${{ inputs.benchmark_id_suffix }}-actions-cache-amd64-rolling
          path: benchmark-results/discourse-image-factory${{ inputs.benchmark_id_suffix }}-actions-cache-amd64-rolling.json
          if-no-files-found: error
      - name: Retain the BoringCache arm64 rolling result
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-discourse-image-factory${{ inputs.benchmark_id_suffix }}-boringcache-arm64-rolling
          path: benchmark-results/discourse-image-factory${{ inputs.benchmark_id_suffix }}-boringcache-arm64-rolling.json
          if-no-files-found: error
      - name: Retain the GitHub Actions arm64 rolling result
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-discourse-image-factory${{ inputs.benchmark_id_suffix }}-actions-cache-arm64-rolling
          path: benchmark-results/discourse-image-factory${{ inputs.benchmark_id_suffix }}-actions-cache-arm64-rolling.json
          if-no-files-found: error

  bundler-report:
    name: Discourse Bundler mount-cache experiment report
    needs: bundler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          pattern: phase-discourse-bundler-cache${{ inputs.benchmark_id_suffix }}-*
          path: phase-evidence
      - run: python3 ./scripts/benchmark-report.py summarize --title "Discourse Bundler mount-cache benchmark" --input-dir phase-evidence --output-dir benchmark-results
      - name: Retain the Bundler mount result
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-discourse-bundler-cache${{ inputs.benchmark_id_suffix }}-boringcache-bundler-amd64-rolling
          path: benchmark-results/discourse-bundler-cache${{ inputs.benchmark_id_suffix }}-boringcache-bundler-amd64-rolling.json
          if-no-files-found: error
      - name: Retain the BoringCache control result
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-discourse-bundler-cache${{ inputs.benchmark_id_suffix }}-boringcache-amd64-rolling
          path: benchmark-results/discourse-bundler-cache${{ inputs.benchmark_id_suffix }}-boringcache-amd64-rolling.json
          if-no-files-found: error
      - name: Retain the GitHub Actions control result
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-discourse-bundler-cache${{ inputs.benchmark_id_suffix }}-actions-cache-amd64-rolling
          path: benchmark-results/discourse-bundler-cache${{ inputs.benchmark_id_suffix }}-actions-cache-amd64-rolling.json
          if-no-files-found: error

  ccache-report:
    name: Discourse ccache tool-cache experiment report
    needs: ccache
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.ccache_experiment }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          pattern: phase-discourse-ccache${{ inputs.benchmark_id_suffix }}-*
          path: phase-evidence
      - run: python3 ./scripts/benchmark-report.py summarize --title "Discourse ccache tool-cache benchmark" --input-dir phase-evidence --output-dir benchmark-results
      - name: Retain the ccache result
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-discourse-ccache${{ inputs.benchmark_id_suffix }}-boringcache-ccache-amd64-rolling
          path: benchmark-results/discourse-ccache${{ inputs.benchmark_id_suffix }}-boringcache-ccache-amd64-rolling.json
          if-no-files-found: error
      - name: Retain the BoringCache control result
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-discourse-ccache${{ inputs.benchmark_id_suffix }}-boringcache-amd64-rolling
          path: benchmark-results/discourse-ccache${{ inputs.benchmark_id_suffix }}-boringcache-amd64-rolling.json
          if-no-files-found: error
      - name: Retain the GitHub Actions control result
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-discourse-ccache${{ inputs.benchmark_id_suffix }}-actions-cache-amd64-rolling
          path: benchmark-results/discourse-ccache${{ inputs.benchmark_id_suffix }}-actions-cache-amd64-rolling.json
          if-no-files-found: error
