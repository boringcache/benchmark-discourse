name: "Discourse upstream image factory fresh"
run-name: "${{ format('Discourse image factory | {0}', github.event_name == 'pull_request' && format('PR {0}', github.event.pull_request.number) || 'Fresh') }}"

on:
  workflow_dispatch:
    inputs:
      cli_version: {description: "Optional exact BoringCache CLI release or prerelease tag.", required: false, type: string, default: ""}
      buildkit_image: {description: "Optional managed BuildKit image canary.", required: false, type: string, default: ""}
      benchmark_id_suffix: {description: "Optional suffix for an isolated comparison.", required: false, type: string, default: ""}
  schedule: [{cron: "17 3 * * 0"}]
  pull_request:
    paths: [".boringcache.toml", ".gitmodules", "plans/**", "scripts/**", ".github/actions/discourse-image-factory/**", ".github/workflows/discourse-image-factory-fresh.yml", "upstream", "docker-upstream"]

concurrency: {group: "${{ github.workflow }}-${{ github.ref_name }}", cancel-in-progress: false}
permissions: {contents: read, actions: write, packages: read}

env:
  BUILDKIT_PROGRESS: plain
  BASE_IMAGE: ghcr.io/boringcache/discourse-benchmark-base
  TEST_IMAGE: ghcr.io/boringcache/discourse-benchmark-test
  BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
  BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}

jobs:
  cold:
    name: ${{ matrix.provider }} ${{ matrix.arch }} cold
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      ARCH: ${{ matrix.arch }}
    strategy: &provider_matrix
      fail-fast: false
      matrix:
        include:
          - {provider: GitHub Actions, strategy: actions-cache, arch: amd64, runner: ubuntu-24.04}
          - {provider: BoringCache, strategy: boringcache, arch: amd64, runner: ubuntu-24.04}
          - {provider: GitHub Actions, strategy: actions-cache, arch: arm64, runner: ubuntu-24.04-arm}
          - {provider: BoringCache, strategy: boringcache, arch: arm64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/discourse-image-factory
        with:
          strategy: ${{ matrix.strategy }}
          cache_lane: fresh
          phase: publish
          arch: ${{ matrix.arch }}
          benchmark_id: ${{ format('discourse-image-factory{0}', inputs.benchmark_id_suffix) }}
          cli_version: ${{ inputs.cli_version }}
          buildkit_image: ${{ inputs.buildkit_image }}

  warm:
    name: ${{ matrix.provider }} ${{ matrix.arch }} warm
    needs: cold
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy: *provider_matrix
    env:
      ARCH: ${{ matrix.arch }}
      BORINGCACHE_SAVE_TOKEN: ""
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/discourse-image-factory
        with:
          strategy: ${{ matrix.strategy }}
          cache_lane: fresh
          phase: warm
          arch: ${{ matrix.arch }}
          benchmark_id: ${{ format('discourse-image-factory{0}', inputs.benchmark_id_suffix) }}
          cli_version: ${{ inputs.cli_version }}
          buildkit_image: ${{ inputs.buildkit_image }}

  report:
    name: Discourse image-factory fresh report
    needs: warm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with: {pattern: "phase-*", path: phase-evidence}
      - run: python3 ./scripts/benchmark-report.py summarize --title "Discourse upstream image-factory fresh benchmark" --input-dir phase-evidence --output-dir benchmark-results
      - name: Retain the BoringCache amd64 fresh result
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-discourse-image-factory${{ inputs.benchmark_id_suffix }}-boringcache-amd64-fresh
          path: benchmark-results/discourse-image-factory${{ inputs.benchmark_id_suffix }}-boringcache-amd64-fresh.json
          if-no-files-found: error
      - name: Retain the GitHub Actions amd64 fresh result
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-discourse-image-factory${{ inputs.benchmark_id_suffix }}-actions-cache-amd64-fresh
          path: benchmark-results/discourse-image-factory${{ inputs.benchmark_id_suffix }}-actions-cache-amd64-fresh.json
          if-no-files-found: error
      - name: Retain the BoringCache arm64 fresh result
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-discourse-image-factory${{ inputs.benchmark_id_suffix }}-boringcache-arm64-fresh
          path: benchmark-results/discourse-image-factory${{ inputs.benchmark_id_suffix }}-boringcache-arm64-fresh.json
          if-no-files-found: error
      - name: Retain the GitHub Actions arm64 fresh result
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-discourse-image-factory${{ inputs.benchmark_id_suffix }}-actions-cache-arm64-fresh
          path: benchmark-results/discourse-image-factory${{ inputs.benchmark_id_suffix }}-actions-cache-arm64-fresh.json
          if-no-files-found: error
